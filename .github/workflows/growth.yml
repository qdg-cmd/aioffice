name: Growth

# Daily growth snapshot from public GitHub signals (release downloads, stars,
# forks), appended to a tracked JSON history. No repository secrets and no
# in-app telemetry; read-only access is enough. Runs on the default branch so
# the commit lands where the daily branch-off starts from.

on:
  workflow_dispatch:

concurrency:
  group: growth-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    # Snapshots must keep appending on the deployment host's default branch;
    # forks and feature branches would fork the history.
    if: github.repository == 'pblsketch/openoffice'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Record growth snapshot
        run: npm run growth

      - name: Commit the updated history
        run: |
          if git diff --quiet -- docs/tracking/growth-history.json docs/tracking/growth-latest.json; then
            echo "No history change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/tracking/growth-history.json docs/tracking/growth-latest.json
          git commit -m "chore: record the $(date -u +%F) growth snapshot"
          git push
