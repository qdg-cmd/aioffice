<?xml version="1.0" encoding="UTF-8"?>
<!--
  IeumOffice logo lockup (source of truth for the in-app sidebar logo).

  Pure black and white on purpose: the shell flips it for dark themes with a
  CSS invert filter, so it must not carry any colour.

  The mark repeats apps/shell/build/brand/app-icon.svg in a single colour; the
  over/under gaps alone separate the ring from the rounded square. The wordmark
  is "IeumOffice" set in Roboto Bold 2.137 (Apache License 2.0) and converted
  to outlines so it renders without the font installed; the capital I is
  redrawn with slab bars so it cannot be read as a lowercase L. See NOTICE.

  Copied verbatim to apps/shell/src/renderer/src/assets/genoffice-logo.svg by
    node tools/gen-brand-assets.mjs
  Keep the 1091x240 canvas: the sidebar sizes the logo by height.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1091" height="240" viewBox="0 0 1091 240" fill="none">
  <svg width="240" height="240" viewBox="0 0 1024 1024">
    <defs>
      <clipPath id="ieum-upper"><rect width="1024" height="512"/></clipPath>
      <clipPath id="ieum-lower"><rect y="512" width="1024" height="512"/></clipPath>
      <mask id="ieum-under-ring" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
        <rect width="1024" height="1024" fill="#fff"/>
        <circle cx="399" cy="512" r="192" fill="none" stroke="#000" stroke-width="160" clip-path="url(#ieum-upper)"/>
      </mask>
      <mask id="ieum-under-square" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
        <rect width="1024" height="1024" fill="#fff"/>
        <rect x="453" y="330" width="364" height="364" rx="96" fill="none" stroke="#000" stroke-width="160" clip-path="url(#ieum-lower)"/>
      </mask>
    </defs>
    <rect width="1024" height="1024" rx="230" fill="black"/>
    <g fill="none" stroke="white" stroke-width="112">
      <rect x="453" y="330" width="364" height="364" rx="96" mask="url(#ieum-under-ring)"/>
      <circle cx="399" cy="512" r="192" mask="url(#ieum-under-square)"/>
    </g>
  </svg>
